<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ReXeR Demo V3 — Workflow</title>
    <style>
      :root {
        --ink: #14121c;
        --ink-2: #2e2a3a;
        --mut: #6b6578;
        --hair: #e4e0ea;
        --paper: #fbfaf8;
        --canvas: #ebe7df;
        --wash: #e4e0d6;
        --journey: #5b4cdb;
        --journey-soft: #ebe8ff;
        --studio: #0f7a6c;
        --studio-soft: #e3f5f1;
        --pulse: #c45a1a;
        --pulse-soft: #ffefe3;
        --exchange: #8a3d6b;
        --exchange-soft: #f8e8f0;
        --entity: #1f4f7a;
        --entity-soft: #e6f0f8;
        --rule: #8a6a14;
        --rule-soft: #f7efd6;
        --seed: #3d5a40;
        --seed-soft: #e6efe7;
        --kind: #4a3f6b;
        --kind-soft: #eeeaf6;
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --display: Georgia, 'Times New Roman', serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--font);
        color: var(--ink);
        background: var(--canvas);
        overflow: hidden;
      }
      .app {
        display: grid;
        grid-template-columns: 1fr minmax(280px, 320px);
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: var(--paper);
        border-bottom: 1px solid var(--hair);
      }
      header h1 {
        margin: 0;
        font-family: var(--display);
        font-size: 17px;
        font-weight: 600;
      }
      .views {
        display: flex;
        gap: 4px;
        margin-left: 8px;
      }
      .views button {
        border: 1px solid var(--hair);
        background: #fff;
        color: var(--ink-2);
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .views button.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .tools {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .tools button {
        border: 1px solid var(--hair);
        background: #fff;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .stage-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: linear-gradient(180deg, #f3efe6, var(--canvas));
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #stage.panning {
        cursor: grabbing;
      }
      .hint {
        position: absolute;
        left: 12px;
        top: 12px;
        font-size: 11px;
        color: var(--mut);
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        border: 1px solid var(--hair);
        border-radius: 8px;
        padding: 5px 9px;
        pointer-events: none;
      }
      .view-note {
        flex: 1;
        min-width: 200px;
        max-width: 520px;
        font-size: 12px;
        line-height: 1.45;
        color: var(--mut);
        padding: 0 4px;
      }
      aside {
        border-left: 1px solid var(--hair);
        background: var(--paper);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel-head {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--hair);
      }
      .panel-head .eyebrow {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mut);
        margin-bottom: 4px;
      }
      .panel-head h2 {
        margin: 0;
        font-family: var(--display);
        font-size: 18px;
        font-weight: 600;
      }
      .panel-body {
        padding: 14px 16px 24px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .panel-body .def {
        margin: 0 0 10px;
      }
      .panel-body .not {
        margin: 0 0 12px;
        padding: 8px 10px;
        background: var(--wash);
        border-radius: 8px;
        color: var(--mut);
        font-size: 12px;
      }
      .panel-body h3 {
        margin: 14px 0 8px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mut);
      }
      .panel-body ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel-body li {
        margin: 0 0 6px;
        padding: 7px 9px;
        border: 1px solid var(--hair);
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .panel-body li:hover {
        background: #faf9f7;
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .keys button {
        border: 1px solid var(--hair);
        background: #fff;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 11px;
        cursor: pointer;
      }
      .keys button:hover {
        border-color: var(--journey);
        color: var(--journey);
      }
      .tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 6px;
      }
      .empty {
        color: var(--mut);
      }

      .lane-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        fill: var(--mut);
      }
      .lane-bg {
        stroke: rgba(20, 18, 28, 0.06);
        stroke-width: 1;
      }
      .lane-journey {
        fill: rgba(91, 76, 219, 0.07);
      }
      .lane-studio {
        fill: rgba(15, 122, 108, 0.07);
      }
      .lane-pulse {
        fill: rgba(196, 90, 26, 0.07);
      }
      .loop-caption {
        font-size: 11px;
        fill: var(--mut);
        font-style: italic;
      }
      .edge {
        fill: none;
        stroke: #7a7388;
        stroke-width: 1.7;
        cursor: pointer;
      }
      .edge.muted {
        stroke: #b5afbf;
        stroke-dasharray: 5 4;
      }
      .edge.rule {
        stroke: var(--rule);
        stroke-dasharray: 6 4;
      }
      .edge.loop {
        stroke: var(--pulse);
        stroke-width: 2;
      }
      .edge.selected {
        stroke: #111;
        stroke-width: 2.4;
        stroke-dasharray: none;
      }
      .edge-label {
        font-size: 10px;
        fill: var(--ink-2);
        pointer-events: none;
      }
      .edge-label-bg {
        fill: rgba(251, 250, 248, 0.97);
        stroke: var(--hair);
        stroke-width: 0.5;
        pointer-events: none;
      }
      .node {
        cursor: pointer;
      }
      .node .body {
        stroke-width: 1.5;
      }
      .node.selected .body {
        stroke: #111;
        stroke-width: 2.2;
      }
      .node .title {
        font-size: 12px;
        font-weight: 700;
        fill: var(--ink);
        pointer-events: none;
      }
      .node .sub {
        font-size: 10px;
        fill: var(--mut);
        pointer-events: none;
      }
      .node.journey .body {
        fill: var(--journey-soft);
        stroke: var(--journey);
      }
      .node.studio .body {
        fill: var(--studio-soft);
        stroke: var(--studio);
      }
      .node.pulse .body {
        fill: var(--pulse-soft);
        stroke: var(--pulse);
      }
      .node.exchange .body {
        fill: var(--exchange-soft);
        stroke: var(--exchange);
      }
      .node.entity .body {
        fill: var(--entity-soft);
        stroke: var(--entity);
      }
      .node.rule .body {
        fill: var(--rule-soft);
        stroke: var(--rule);
      }
      .node.seed .body {
        fill: var(--seed-soft);
        stroke: var(--seed);
      }
      .node.kind .body {
        fill: var(--kind-soft);
        stroke: var(--kind);
      }
      .node.meta .body {
        fill: #f1efe9;
        stroke: #9a93a6;
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr minmax(200px, 36%);
        }
        aside {
          border-left: none;
          border-top: 1px solid var(--hair);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">

          <g id="world">
            <g id="lanes"></g>
            <g id="edges"></g>
            <g id="nodes"></g>

      </div>
      <aside>

          <h2 id="panelTitle">Chọn một ô</h2>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </div>

      const applyLayout = viewId => {

        const colW =
          viewId === 'seed'
            ? 136
            : viewId === 'kinds'
              ? 148
              : viewId === 'overview'
                ? OVERVIEW_COL_W
                : COL_W;
        const rowH = viewId === 'seed' ? 80 : ROW_H;
        NODES.forEach(n => {
          if (!n.views.includes(viewId)) return;
          const slot = grid[n.id];
          if (!slot) return;
          n.x = ORIGIN.x + slot.col * colW;
          n.y = ORIGIN.y + slot.row * rowH;
          n.w = slot.w || NW;
          n.h = slot.h || NH;
          n._col = slot.col;
          n._row = slot.row;
        });
      };

      const stage = document.getElementById('stage');

      const nodeById = id => NODES.find(n => n.id === id);
      const edgeById = id => EDGES.find(e => e.id === id);
      const visibleNodes = () =>
        NODES.filter(n => n.views.includes(activeView));
      const visibleEdges = () =>
        EDGES.filter(e => {
          if (!e.views.includes(activeView)) return false;
          return nodeById(e.from) && nodeById(e.to);
        });

      const sizeOf = n => ({ w: n.w || NW, h: n.h || NH });
      const centerOf = n => {
        const { w, h } = sizeOf(n);
        return { x: n.x + w / 2, y: n.y + h / 2 };
      };

      const edgePoint = (n, toward) => {
        const { w, h } = sizeOf(n);
        const c = centerOf(n);
        const dx = toward.x - c.x;
        const dy = toward.y - c.y;
        if (!dx && !dy) return c;
        const ax = Math.abs(dx);
        const ay = Math.abs(dy);
        const hw = w / 2;
        const hh = h / 2;
        if (ax * hh > ay * hw) {
          const sx = dx > 0 ? hw : -hw;
          return { x: c.x + sx, y: c.y + (dy * hw) / ax };
        }
        const sy = dy > 0 ? hh : -hh;
        return { x: c.x + (dx * hh) / ay, y: c.y + sy };
      };

      const pathFor = (a, b) => {
        const c1 = centerOf(a);
        const c2 = centerOf(b);
        const p1 = edgePoint(a, c2);
        const p2 = edgePoint(b, c1);
        const mx = (p1.x + p2.x) / 2;
        const my = (p1.y + p2.y) / 2;
        return {
          d: `M${p1.x},${p1.y} Q${mx},${my - 8} ${p2.x},${p2.y}`,
          mx,
          my: my - 14,
        };
      };

      const port = (n, side, t = 0.5) => {
        const { w, h } = sizeOf(n);
        if (side === 'r') return { x: n.x + w, y: n.y + h * t };
        if (side === 'l') return { x: n.x, y: n.y + h * t };
        if (side === 't') return { x: n.x + w * t, y: n.y };
        return { x: n.x + w * t, y: n.y + h };
      };

      const orthoPath = points => {
        if (!points.length) return '';
        let d = `M${points[0].x},${points[0].y}`;
        for (let i = 1; i < points.length; i += 1) {
          d += ` L${points[i].x},${points[i].y}`;
        }
        return d;
      };

      const colBounds = col => {
        const ns = visibleNodes().filter(n => n._col === col);
        if (!ns.length) {
          return {
            left: ORIGIN.x + col * OVERVIEW_COL_W,
            right: ORIGIN.x + (col + 1) * OVERVIEW_COL_W,
          };
        }
        return {
          left: Math.min(...ns.map(n => n.x)),
          right: Math.max(...ns.map(n => n.x + sizeOf(n).w)),
        };
      };

      const gutterX = (colA, colB, lane = 0.5) => {
        const lo = Math.min(colA, colB);
        const hi = Math.max(colA, colB);
        const left = colBounds(lo).right + 8;
        const right = colBounds(hi).left - 8;
        if (right <= left) return left + 12;
        return left + (right - left) * lane;
      };

        }

        const gx = gutterX(a._col ?? 0, b._col ?? 0, 0.5);
        const p1 = port(a, 'r', 0.5);
        const p2 = port(b, 'l', 0.5);
        return {
          d: orthoPath([p1, { x: gx, y: p1.y }, { x: gx, y: p2.y }, p2]),
          mx: gx,
          my: (p1.y + p2.y) / 2,
          labelAnchor: 'middle',
        };
      };

      const pathForEdge = (a, b, edgeId) =>
        activeView === 'overview'
          ? pathForOverview(a, b, edgeId)
          : pathFor(a, b);

      const labelBgSize = text => ({
        w: Math.max(44, text.length * 6.2 + 14),
        h: 16,
      });

      const labelBoxHitsNode = (x, y, w, h, pad = 6) =>
        visibleNodes().some(n => {
          const nx = n.x - pad;
          const ny = n.y - pad;
          const nw = sizeOf(n).w + pad * 2;
          const nh = sizeOf(n).h + pad * 2;
          return x < nx + nw && x + w > nx && y < ny + nh && y + h > ny;
        });

      const placeEdgeLabel = (mx, my, text, anchor = 'middle') => {
        const { w: lw, h: lh } = labelBgSize(text);
        const offsets =
          anchor === 'start'
            ? [
                [8, 0],
                [8, -18],
                [8, 18],
                [8, -34],
                [8, 34],
              ]
            : anchor === 'end'
              ? [
                  [-8, 0],
                  [-8, -18],
                  [-8, 18],
                  [-8, -34],
                  [-8, 34],
                ]
              : [
                  [0, 0],
                  [0, -18],
                  [0, 18],
                  [14, 0],
                  [-14, 0],
                  [0, -34],
                  [0, 34],
                ];

        for (const [dx, dy] of offsets) {
          const tx =
            anchor === 'start'
              ? mx + dx
              : anchor === 'end'
                ? mx - lw + dx
                : mx - lw / 2 + dx;
          const ty = my - lh / 2 + dy;
          if (!labelBoxHitsNode(tx, ty, lw, lh)) {
            const textX =
              anchor === 'start'
                ? tx + 7
                : anchor === 'end'
                  ? tx + lw - 7
                  : tx + lw / 2;
            return { bgX: tx, bgY: ty, textX, textY: ty + lh - 4, anchor };
          }
        }

        const tx =
          anchor === 'start'
            ? mx + 8
            : anchor === 'end'
              ? mx - lw - 8
              : mx - lw / 2;
        const ty = my - lh / 2;
        const textX =
          anchor === 'start'
            ? tx + 7
            : anchor === 'end'
              ? tx + lw - 7
              : tx + lw / 2;
        return { bgX: tx, bgY: ty, textX, textY: ty + lh - 4, anchor };
      };

      const applyView = () => {
        world.setAttribute(
          'transform',
          `translate(${view.x},${view.y}) scale(${view.k})`
        );
      };

      const markerFor = (style, sel) => {
        if (sel) return 'url(#arrow-sel)';
        if (style === 'loop') return 'url(#arrow-loop)';
        if (style === 'rule') return 'url(#arrow-rule)';
        return 'url(#arrow)';
      };

      const renderLanes = () => {
        gLanes.innerHTML = '';

        if (activeView === 'overview') {
          const moduleTop = ORIGIN.y + ROW_H * OVERVIEW_MODULE_ROW - 32;
          const moduleBottom =
            ORIGIN.y + ROW_H * (OVERVIEW_MODULE_ROW + 5) + NH + 32;
          const lanes = [
            { col: 0, label: 'JOURNEY', cls: 'lane-journey' },
            { col: 1, label: 'STUDIO', cls: 'lane-studio' },
            { col: 2, label: 'PULSE', cls: 'lane-pulse' },
          ];
          lanes.forEach(({ col, label, cls }) => {
            const band = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'text'
            );
            band.setAttribute('class', 'lane-label');
            band.setAttribute('x', String(ORIGIN.x + col * OVERVIEW_COL_W + 6));
            band.setAttribute('y', String(moduleTop - 8));
            band.textContent = label;
            gLanes.appendChild(band);

            const rect = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'rect'
            );
            rect.setAttribute('class', `lane-bg ${cls}`);
            rect.setAttribute(
              'x',
              String(ORIGIN.x + col * OVERVIEW_COL_W - 10)
            );
            rect.setAttribute('y', String(moduleTop));
            rect.setAttribute('width', String(OVERVIEW_COL_W - 12));
            rect.setAttribute('height', String(moduleBottom - moduleTop));
            rect.setAttribute('rx', '12');
            gLanes.appendChild(rect);
          });

          const cap = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          cap.setAttribute('class', 'loop-caption');
          cap.setAttribute('x', String(ORIGIN.x));
          cap.setAttribute('y', String(ORIGIN.y + ROW_H + 54));
          cap.textContent = 'Vòng: plan → build → measure → re-plan';
          gLanes.appendChild(cap);
          return;
        }

        const list = visibleNodes();
        if (!list.length) return;
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        list.forEach(n => {
          const { w, h } = sizeOf(n);
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + w);
          maxY = Math.max(maxY, n.y + h);
        });
        const pad = 20;
        const rect = document.createElementNS(
          'http://www.w3.org/2000/svg',
          'rect'
        );
        rect.setAttribute('class', 'lane-bg lane-journey');
        rect.setAttribute('x', String(minX - pad));
        rect.setAttribute('y', String(minY - pad));
        rect.setAttribute('width', String(maxX - minX + pad * 2));
        rect.setAttribute('height', String(maxY - minY + pad * 2));
        rect.setAttribute('rx', '16');
        gLanes.appendChild(rect);
      };

      const renderEdges = () => {
        gEdges.innerHTML = '';
        visibleEdges().forEach(e => {
          const a = nodeById(e.from);
          const b = nodeById(e.to);
          const { d } = pathForEdge(a, b, e.id);
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const hit = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'path'
          );
          hit.setAttribute('d', d);
          hit.setAttribute('fill', 'none');
          hit.setAttribute('stroke', 'transparent');
          hit.setAttribute('stroke-width', '14');
          hit.style.cursor = 'pointer';
          const path = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'path'
          );
          const sel = selected?.type === 'edge' && selected.id === e.id;
          path.setAttribute('d', d);
          path.setAttribute(
            'class',
            `edge ${e.style || 'solid'}${sel ? ' selected' : ''}`
          );
          path.setAttribute('marker-end', markerFor(e.style, sel));
          const pick = ev => {
            ev.stopPropagation();
            select({ type: 'edge', id: e.id });
          };
          hit.addEventListener('pointerdown', pick);
          path.addEventListener('pointerdown', pick);
          g.appendChild(hit);
          g.appendChild(path);
          gEdges.appendChild(g);
        });
      };

      const renderEdgeLabels = () => {
        gEdgeLabels.innerHTML = '';
        visibleEdges().forEach(e => {
          if (!e.label) return;
          const a = nodeById(e.from);
          const b = nodeById(e.to);
          const { mx, my, labelAnchor = 'middle' } = pathForEdge(a, b, e.id);
          const { w: lw, h: lh } = labelBgSize(e.label);
          const placed = placeEdgeLabel(mx, my, e.label, labelAnchor);
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const bg = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'rect'
          );
          bg.setAttribute('class', 'edge-label-bg');
          bg.setAttribute('x', String(placed.bgX));
          bg.setAttribute('y', String(placed.bgY));
          bg.setAttribute('width', String(lw));
          bg.setAttribute('height', String(lh));
          bg.setAttribute('rx', '4');
          const lab = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          lab.setAttribute('class', 'edge-label');
          lab.setAttribute('x', String(placed.textX));
          lab.setAttribute('y', String(placed.textY));
          lab.setAttribute('text-anchor', placed.anchor);
          lab.textContent = e.label;
          g.appendChild(bg);
          g.appendChild(lab);
          gEdgeLabels.appendChild(g);
        });
      };

      const renderNodes = () => {
        gNodes.innerHTML = '';
        visibleNodes().forEach(n => {
          const { w, h } = sizeOf(n);
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('class', `node ${n.group}`);
          g.setAttribute('transform', `translate(${n.x},${n.y})`);
          if (selected?.type === 'node' && selected.id === n.id)
            g.classList.add('selected');
          const body = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'rect'
          );
          body.setAttribute('class', 'body');
          body.setAttribute('width', String(w));
          body.setAttribute('height', String(h));
          body.setAttribute('rx', '10');
          const title = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );
          title.setAttribute('class', 'title');
          title.setAttribute('x', '12');
          title.setAttribute('y', n.sub ? '20' : String(h / 2 + 4));
          title.textContent = n.label;
          g.appendChild(body);
          g.appendChild(title);
          if (n.sub) {
            const sub = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'text'
            );
            sub.setAttribute('class', 'sub');
            const chunks = n.sub.includes(', ')
              ? n.sub.split(', ')
              : n.sub.includes(' · ')
                ? n.sub.split(' · ')
                : [n.sub];
            if (chunks.length >= 4) {
              sub.setAttribute('x', '12');
              sub.setAttribute('y', '36');
              const line1 = document.createElementNS(
                'http://www.w3.org/2000/svg',
                'tspan'
              );
              line1.setAttribute('x', '12');
              line1.textContent = chunks.slice(0, 2).join(', ');
              const line2 = document.createElementNS(
                'http://www.w3.org/2000/svg',
                'tspan'
              );
              line2.setAttribute('x', '12');
              line2.setAttribute('dy', '13');
              line2.textContent = chunks.slice(2).join(', ');
              sub.appendChild(line1);
              sub.appendChild(line2);
            } else {
              sub.setAttribute('x', '12');
              sub.setAttribute('y', '38');
              sub.textContent = n.sub;
            }
            g.appendChild(sub);
          }
          g.addEventListener('pointerdown', ev => {
            ev.stopPropagation();
            select({ type: 'node', id: n.id });
          });
          gNodes.appendChild(g);
        });
      };

      const render = () => {
        applyLayout(activeView);
        renderLanes();
        renderEdges();
        renderNodes();
        renderEdgeLabels();
        applyView();
        const meta = VIEWS.find(v => v.id === activeView);
        document.getElementById('viewNote').textContent = meta?.note || '';
      };

      const groupTag = group => {
        const map = {
          journey: ['JOURNEY', 'var(--journey-soft)', 'var(--journey)'],
          studio: ['STUDIO', 'var(--studio-soft)', 'var(--studio)'],
          pulse: ['PULSE', 'var(--pulse-soft)', 'var(--pulse)'],
          exchange: ['EXCHANGE', 'var(--exchange-soft)', 'var(--exchange)'],
          entity: ['ENTITY', 'var(--entity-soft)', 'var(--entity)'],
          rule: ['RULE', 'var(--rule-soft)', 'var(--rule)'],
          seed: ['SEED', 'var(--seed-soft)', 'var(--seed)'],
          kind: ['KIND', 'var(--kind-soft)', 'var(--kind)'],
          meta: ['META', '#f1efe9', '#6b6578'],
        };
        return map[group] || map.meta;
      };

      const bindPanel = () => {
        const body = document.getElementById('panelBody');
        body.querySelectorAll('[data-key]').forEach(el => {
          el.addEventListener('click', () =>
            showKey(el.getAttribute('data-key'))
          );
        });
        body.querySelectorAll('[data-node]').forEach(el => {
          el.addEventListener('click', () =>
            select({ type: 'node', id: el.getAttribute('data-node') })
          );
        });
      };

      const showHome = () => {
        document.getElementById('panelEyebrow').textContent = 'ReXeR workflow';
        document.getElementById('panelTitle').textContent = 'Đọc theo 4 tab';
        document.getElementById('panelBody').innerHTML = `
          <p class="def">Mỗi tab một chuyện. Không chồng hết lên một canvas.</p>
          <ol style="margin:0 0 12px;padding-left:18px;font-size:12px;color:var(--ink-2);line-height:1.55">
            <li><b>Vòng lặp</b> — Journey / Studio / Pulse + Exchange</li>
            <li><b>Campaign ↔ Journey</b> — fork copy, subject, jExpFor, facts</li>
            <li><b>Node kinds</b> — từ vựng graph</li>
            <li><b>Ví dụ path</b> — Product Launch & Gift Season</li>
          </ol>
          <h3>Keyword hay nhầm</h3>
          <div class="keys">
            ${[
              'Campaign',
              'Journey',
              'Experience',
              'Blueprint',
              'Copy',
              'Fork',
              'jExpFor',
              'R2',
              'R5',
              'Exchange',
            ]
              .map(k => `<button type="button" data-key="${k}">${k}</button>`)
              .join('')}
          </div>
        `;
        bindPanel();
      };

      const showKey = key => {
        const g = GLOSSARY[key];
        if (!g) return;
        document.getElementById('panelEyebrow').textContent = 'Keyword';
        document.getElementById('panelTitle').textContent = key;
        const related = NODES.filter(
          n => n.key === key || (n.def && n.def.includes(key))
        ).slice(0, 6);
        document.getElementById('panelBody').innerHTML = `
          <p class="def">${g.d}</p>
          ${g.not && g.not !== '—' ? `<p class="not"><b>Không phải:</b> ${g.not}</p>` : ''}
          <h3>Liên quan</h3>
          <ul>${
            related
              .map(n => `<li data-node="${n.id}">${n.label}</li>`)
              .join('') ||
            '<li class="empty" style="border:none;cursor:default">—</li>'
          }</ul>
        `;
        bindPanel();
      };

      const showNode = n => {
        const [lab, bg, fg] = groupTag(n.group);
        document.getElementById('panelEyebrow').innerHTML =
          `<span class="tag" style="background:${bg};color:${fg}">${lab}</span>`;
        document.getElementById('panelTitle').textContent = n.label;
        const g = n.key && GLOSSARY[n.key];
        const ins = visibleEdges().filter(e => e.to === n.id);
        const outs = visibleEdges().filter(e => e.from === n.id);
        document.getElementById('panelBody').innerHTML = `
          ${n.sub ? `<p class="empty" style="margin:0 0 8px">${n.sub}</p>` : ''}
          <p class="def">${n.def}</p>
          ${g ? `<p class="not"><b>${n.key}:</b> ${g.d}${g.not && g.not !== '—' ? `<br><b>Không phải:</b> ${g.not}` : ''}</p>` : ''}
          ${n.key ? `<div class="keys"><button type="button" data-key="${n.key}">Keyword ${n.key}</button></div>` : ''}
          <h3>Vào</h3>
          <ul>${ins.map(e => `<li>${nodeById(e.from).label}${e.label ? ` · ${e.label}` : ''}</li>`).join('') || '<li class="empty" style="border:none;cursor:default">—</li>'}</ul>
          <h3>Ra</h3>
          <ul>${outs.map(e => `<li>${nodeById(e.to).label}${e.label ? ` · ${e.label}` : ''}</li>`).join('') || '<li class="empty" style="border:none;cursor:default">—</li>'}</ul>
        `;
        bindPanel();
      };

      const showEdge = e => {
        const a = nodeById(e.from);
        const b = nodeById(e.to);
        document.getElementById('panelEyebrow').textContent = 'Quan hệ';
        document.getElementById('panelTitle').textContent =
          e.label || `${a.label} → ${b.label}`;
        const g = e.key && GLOSSARY[e.key];
        document.getElementById('panelBody').innerHTML = `
          <p class="def">${a.label} → ${b.label}</p>
          ${g ? `<p class="not"><b>${e.key}:</b> ${g.d}</p>` : ''}
          ${e.key ? `<div class="keys"><button type="button" data-key="${e.key}">${e.key}</button></div>` : ''}
          <h3>Endpoints</h3>
          <ul>
            <li data-node="${a.id}">← ${a.label}</li>
            <li data-node="${b.id}">→ ${b.label}</li>
          </ul>
        `;
        bindPanel();
      };

      const select = sel => {
        selected = sel;
        render();
        if (!sel) return showHome();
        if (sel.type === 'node') showNode(nodeById(sel.id));
        else showEdge(edgeById(sel.id));
      };

      const fitView = () => {
        applyLayout(activeView);
        const list = visibleNodes();
        if (!list.length) return;
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        list.forEach(n => {
          const { w, h } = sizeOf(n);
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + w);
          maxY = Math.max(maxY, n.y + h);
        });
        const pad = 64;
        const rect = stage.getBoundingClientRect();
        const bw = maxX - minX + pad * 2;
        const bh = maxY - minY + pad * 2;
        const k = Math.min(
          1.15,
          Math.max(0.55, Math.min(rect.width / bw, rect.height / bh) * 0.88)
        );
        view.k = k;
        view.x = (rect.width - bw * k) / 2 - (minX - pad) * k;
        view.y = (rect.height - bh * k) / 2 - (minY - pad) * k;
        applyView();
      };

      const setView = id => {
        activeView = id;
        selected = null;
        document.querySelectorAll('.views button').forEach(b => {
          b.classList.toggle('on', b.dataset.view === id);
        });
        render();
        showHome();
        requestAnimationFrame(fitView);
      };

      /* Pan + zoom only — no node drag */
      const onMove = ev => {
        if (!pan) return;
        view.x = pan.ox + (ev.clientX - pan.sx);
        view.y = pan.oy + (ev.clientY - pan.sy);
        applyView();
      };
      const endPan = () => {
        if (!pan) return;
        pan = null;
        stage.classList.remove('panning');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', endPan);
      };

      stage.addEventListener('pointerdown', ev => {
        pan = { sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y };
        stage.classList.add('panning');
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', endPan);
        select(null);
      });

      stage.addEventListener(
        'wheel',
        ev => {
          ev.preventDefault();
          const rect = stage.getBoundingClientRect();
          const mx = ev.clientX - rect.left;
          const my = ev.clientY - rect.top;
          const wx = (mx - view.x) / view.k;
          const wy = (my - view.y) / view.k;
          const next = Math.min(
            2,
            Math.max(0.4, view.k * (ev.deltaY < 0 ? 1.08 : 1 / 1.08))
          );
          view.k = next;
          view.x = mx - wx * view.k;
          view.y = my - wy * view.k;
          applyView();
        },
        { passive: false }
      );

      document.getElementById('btnFit').addEventListener('click', fitView);
      document.getElementById('btnReset').addEventListener('click', () => {
        view = { x: 40, y: 30, k: 1 };
        fitView();
      });

      const viewsEl = document.getElementById('views');
      VIEWS.forEach(v => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.view = v.id;
        b.textContent = v.label;
        b.addEventListener('click', () => setView(v.id));
        viewsEl.appendChild(b);
      });

      setView('overview');
      window.addEventListener('resize', () => applyView());
    </script>
  </body>
</html>
