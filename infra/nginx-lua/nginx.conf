worker_processes 1;
events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Thêm chỉ thị resolver
    resolver 8.8.8.8 8.8.4.4;  # Sử dụng Google DNS hoặc DNS phù hợp với môi trường của bạn

    server {
        listen 8080;
        server_name ~^(?<subdomain>.+)\.ncaa.tekup.vn$;
        # server_name ~^(?<subdomain>.+)\.localhost$;
 
        location / {
            # Đặt giá trị proxy_pass vào một biến
            set $backend_path "http://117.2.120.254:80/";
            access_by_lua_block {
                local http = require "resty.http"
                    local cjson = require "cjson"  -- Thư viện để phân tích cú pháp JSON
                local httpc = http.new()

                ngx.log(ngx.ERR, "ngx.var.subdomain: ", ngx.var.subdomain)

                local domain = ngx.var.host
                local urlDetect = "https://ncaa-api.tekup.vn/api/v1/slug?slug=" .. ngx.var.subdomain

                ngx.log(ngx.ERR, "urlDetect: ", urlDetect)

                local res, err = httpc:request_uri(urlDetect, {
                    method = "GET", 
                    ssl_verify = false,
                })


                if not res then
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("Failed to call API: ", err)
                    ngx.log(ngx.ERR, "Failed to call API: ", err)
                    return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                local ok, json_data = pcall(cjson.decode, res.body)
 
                if not ok then
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("Failed to parse JSON response")
                    ngx.log(ngx.ERR, "Failed to parse JSON response: ", json_data)
                    return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                local path = json_data.data
                if not path then
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("Failed to get path from API")
                    ngx.log(ngx.ERR, "Failed to get path from API")
                    return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                ngx.var.backend_path = "http://117.2.120.254:80/" .. path
            }
            proxy_pass $backend_path;
            # proxy_set_header Host $host;
            proxy_set_header Host "ncaa.tekup.vn";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_next/ {
            proxy_pass http://117.2.120.254:80;
            # proxy_set_header Host $host;
            proxy_set_header Host "ncaa.tekup.vn";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
